<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>カフェ ひだまり</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <h1 id="title">カフェ ひだまり</h1>
    <nav class="global-nav">
      <ul>
        <li><a href="#menu">メニュー</a></li>
        <li><a href="#access">アクセス</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section id="hero" class="hero">
      <img id="hero-image" src="images/hero.png" alt="店内の様子" width="320" height="180">
      <p class="lead">駅から歩いて 3 分の小さなカフェです。</p>
    </section>

    <section id="menu" class="menu">
      <h2>メニュー</h2>
      <div class="card">
        <h3>ブレンドコーヒー</h3>
        <p class="price">450 円</p>
      </div>
      <div class="card">
        <h3>チーズケーキ</h3>
        <p class="price">500 円</p>
      </div>
    </section>

    <section id="access" class="access">
      <h2>アクセス</h2>
      <p>〇〇駅 東口から徒歩 3 分</p>
    </section>
  </main>

  <footer class="site-footer">
    <small>&copy; 2026 カフェ ひだまり</small>
  </footer>
</body>
</html>
